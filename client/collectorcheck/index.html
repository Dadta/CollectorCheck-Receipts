<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollectorCheck</title>
  <link rel="stylesheet" href="../shared/notifications.css">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/notifications.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">Artifact continuity</p>
      <h1>CollectorCheck</h1>
      <p class="subtitle">Artifact records and provenance history.</p>
    </header>
    <section class="panel" aria-label="Artifact vault">
      <div class="fields">
        <label for="name">Artifact name</label>
        <input id="name" name="name" placeholder="Artifact name">
        <label for="type">Type</label>
        <input id="type" name="type" placeholder="Artifact type">
        <label for="value">Estimated value</label>
        <input id="value" name="value" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="0" step="1" inputmode="numeric" placeholder="Years">
      </div>
      <div class="actions">
        <button type="button" onclick="add()">Add artifact</button>
        <button type="button" class="secondary" onclick="provenance()">Provenance</button>
      </div>
      <pre id="output" aria-live="polite">Ready.</pre>
    </section>
  </main>
</body>
</html>
