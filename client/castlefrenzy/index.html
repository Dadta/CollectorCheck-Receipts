<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CastleFrenzy</title>
  <link rel="stylesheet" href="../shared/notifications.css">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/notifications.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">Identity continuity</p>
      <h1>CastleFrenzy</h1>
      <p class="subtitle">Castle rooms and progression.</p>
    </header>
    <section class="panel" aria-label="Castle rooms">
      <div class="fields">
        <label for="roomName">Room name</label>
        <input id="roomName" name="roomName" placeholder="New room name">
      </div>
      <div class="actions">
        <button type="button" onclick="addRoom()">Add room</button>
        <button type="button" class="secondary" onclick="loadRooms()">Load rooms</button>
      </div>
      <pre id="output" aria-live="polite">Ready.</pre>
    </section>
  </main>
</body>
</html>
