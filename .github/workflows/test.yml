name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: node-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectorcheck-receipts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collectorcheck-receipts/package-lock.json
      - run: npm ci
      - run: npm test