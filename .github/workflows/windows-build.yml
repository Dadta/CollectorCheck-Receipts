name: Windows Automation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    name: windows-build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collectorcheck-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collectorcheck-receipts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build