name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    name: build-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectorcheck-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collectorcheck-receipts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build