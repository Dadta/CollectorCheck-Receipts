name: Bug report
description: Report a problem with CollectorCheck
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and app version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove receipt contents, credentials, and other private data before posting.name: Bug report
